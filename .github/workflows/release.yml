# npm publish через trusted publishing — OIDC вместо токена (MPJ-286, MPJ-344).
#
# Триггер: публикация GitHub Release (тег vX.Y.Z) или ручной запуск.
# Требования:
#   - на npmjs.com у пакета настроен trusted publisher: этот репозиторий
#     + имя ЭТОГО файла (release.yml), без environment;
#   - версия в package.json == тегу релиза (проверяется шагом ниже);
#   - npm CLI >= 11.5.1 и Node >= 22.14 — иначе npm не умеет обмен OIDC-токена
#     и падает на 404/ENEEDAUTH (поэтому node 24 + явный npm@latest ниже).
# Долгоживущего NPM_TOKEN нет: npm получает короткоживущий токен по OIDC,
# provenance подписывается тем же id-token.
#
# Переименование этого файла ломает публикацию: trusted publisher привязан
# к имени workflow-файла. Меняешь имя — меняй и настройку на npmjs.com.

name: Release (npm publish)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: и авторизация публикации, и provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Node 24 приносит npm 11.x, но точный минор не гарантирован — фиксируем
      # явно, чтобы обмен OIDC-токена был доступен независимо от образа раннера.
      - run: npm install -g npm@latest
      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::package.json version v${PKG_VERSION} != release tag ${TAG}"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      # build выполнит prepublishOnly внутри npm publish, но гоняем явно,
      # чтобы падение сборки было отдельным шагом, а не внутри publish.
      - run: npm run build
      # Токена нет намеренно: npm обменивает OIDC id-token на короткоживущий
      # publish-токен сам. --provenance оставлен явно — при trusted publishing
      # он избыточен по докам, но без него встречаются отказы публикации.
      - name: Publish to npm (OIDC + provenance)
        run: npm publish --provenance
